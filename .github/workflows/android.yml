name: Build FearLauncher APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # AGGRESSIVE GRADLE CACHING: Yeh dependencies, wrapper aur build outputs sab cache karega
      - name: Setup Gradle Advanced Cache
        uses: gradle/actions/setup-gradle@v4

      # DIAGNOSTIC DEBUG STEP: Yeh tumhare folder structure ka X-ray karke logs mein dikhayega
      - name: Check Folder Structure (Debug Path)
        run: |
          echo "========================================="
          echo "LOG: Checking where files actually are..."
          echo "========================================="
          find . -maxdepth 4 -not -path '*/.*'

      - name: Give Permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FearLauncher
          path: app/build/outputs/apk/debug/app-debug.apk
