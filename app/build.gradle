plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false // Optional: agar Kotlin use karna ho
}

android {
    // ✅ Namespace - AndroidManifest.xml se hata kar yahan define karna hai (AGP 8.0+)
    namespace 'com.korax.launcher'
    
    compileSdk 34

    defaultConfig {
        applicationId "com.korax.launcher"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        
        // Optional: Multi-dex support agar methods limit cross ho jaye
        multiDexEnabled true
        
        // Resource configs
        resourceConfigurations += ['en', 'hi']
    }

    // ✅ Java Compatibility - Java 17 required for AGP 8.0+
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    // ✅ Kotlin Options (agar Kotlin use kar rahe ho)
    kotlinOptions {
        jvmTarget = '17'
    }

    // ✅ Build Types
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug // Temporary: release ke liye apna keystore setup karna
        }
        debug {
            minifyEnabled false
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    // ✅ Build Features
    buildFeatures {
        viewBinding true
        // buildConfig true // AGP 8.0+ mein BuildConfig ke liye explicitly enable karna padta hai
    }

    // ✅ Packaging Options - Conflicts resolve karne ke liye
    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module'
            ]
        }
    }

    // ✅ Lint Options - Build fast karne ke liye
    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'MissingTranslation', 'ExtraTranslation'
    }
}

// ✅ Dependencies
dependencies {
    // ✅ AndroidX Core Libraries
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    
    // ✅ MultiDex (minSdk 24+ ke liye optional, par safe side pe)
    implementation 'androidx.multidex:multidex:2.0.1'
    
    // ✅ Core Library Desugaring (Java 8+ features ke liye)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    
    // ✅ Lifecycle Components
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    
    // ✅ Coroutines (Async tasks ke liye)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    // ✅ Networking (Agar launcher mein updates/download feature hai)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    
    // ✅ JSON Parsing
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // ✅ Image Loading (Agar icons/images load karne hain)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    
    // ✅ File/Storage Utilities
    implementation 'commons-io:commons-io:2.15.1'
    
    // ✅ Logging
    implementation 'com.orhanobut:logger:2.2.0'
    
    // ✅ Unit Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// ✅ Resolve dependency conflicts agar koi version mismatch ho
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core-ktx:1.12.0'
        force 'androidx.appcompat:appcompat:1.6.1'
    }
}
