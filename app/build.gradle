plugins {
    id 'com.android.application'
}

android {
    // ✅ Namespace matching your package
    namespace 'com.fearlauncher.app'
    
    // Compile SDK
    compileSdk 34

    defaultConfig {
        applicationId "com.fearlauncher.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true // Enable multidex for large apps
    }

    // Java Version (Java 17 is safe for Android 14+)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            applicationIdSuffix '.debug'
            versionNameSuffix '-DEBUG'
        }
    }

    // Exclude conflicting files
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    // -----------------------------------------
    // 1. Core Android Libraries
    // -----------------------------------------
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.multidex:multidex:2.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // -----------------------------------------
    // 2. Material Design & UI Components (For new design)
    // -----------------------------------------
    implementation 'com.google.android.material:material:1.11.0' // Includes FAB, CardView, etc.
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Specific components for layout
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // -----------------------------------------
    // 3. Networking & Data (Auth & Accounts)
    // -----------------------------------------
    implementation 'com.google.code.gson:gson:2.10.1'       // JSON parsing
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'     // Network requests
    implementation 'androidx.browser:browser:1.8.0'         // For Microsoft Login Tabs

    // -----------------------------------------
    // 4. Testing
    // -----------------------------------------
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
