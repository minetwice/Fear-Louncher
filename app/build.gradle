plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' // If using Kotlin
}

android {
    namespace 'com.fearlauncher.app' // Package name goes here
    compileSdk 33 // Use 33 instead of 34 for now

    defaultConfig {
        applicationId "com.fearlauncher.app"
        minSdk 21
        targetSdk 33 // Match compileSdk
        versionCode 1
        versionName "1.0.0"
    }

    buildFeatures {
        viewBinding true // Enable view binding
    }

    // ... rest of your config ...
}

dependencies {
    // Use these specific versions
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.databinding:viewbinding:8.1.0'

    // Other dependencies
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
